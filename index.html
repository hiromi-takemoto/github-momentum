<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Momentum</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #16181d;
      background: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
      color: #16181d;
      line-height: 1.5;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 10px 0 0;
      color: #4b5563;
    }

    .observation {
      margin: 28px 0 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin: 24px 0 16px;
    }

    button {
      min-height: 42px;
      padding: 8px 18px;
      border: 1px solid #d7dae0;
      border-radius: 7px;
      background: #ffffff;
      color: #16181d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: #16181d;
      background: #16181d;
      color: #ffffff;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #0b4fc4;
      outline-offset: 2px;
    }

    button:disabled {
      border-color: #d7dae0;
      background: #f5f6f8;
      color: #4b5563;
      cursor: not-allowed;
    }

    .notice, .error {
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid #d7dae0;
      border-radius: 7px;
      background: #f5f6f8;
      color: #4b5563;
    }

    .error {
      color: #16181d;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d7dae0;
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 860px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 13px 14px;
      border-bottom: 1px solid #d7dae0;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f6f8;
      font-size: 0.875rem;
      white-space: nowrap;
    }

    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.has-status { background: #f5f6f8; }

    .rank { width: 68px; }
    .repo { width: 44%; }
    .language { width: 14%; }
    .velocity { width: 130px; }
    .stars { width: 120px; }
    .status { width: 104px; }

    .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .repo-link {
      color: #0b4fc4;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status-badge { display: none; }

    .description {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #4b5563;
      font-size: 0.875rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .velocity-value {
      color: #0a6b3d;
      font-weight: 700;
    }

    .measuring, .archived { color: #4b5563; }
    .stopped { color: #8a4b00; font-weight: 700; }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      main {
        width: calc(100% - 24px);
        padding-top: 28px;
      }

      .observation { font-size: 0.9375rem; }
      .controls button { flex: 1; }

      .table-wrap { overflow-x: hidden; }

      table {
        min-width: 0;
        table-layout: fixed;
      }

      th, td { padding: 11px 4px; }
      th { font-size: 0.75rem; }

      .rank {
        width: 40px;
        max-width: 40px;
      }

      .repo { width: auto; }
      .language, .status { display: none; }

      .velocity, .stars { width: 80px; }

      .repo-title {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 4px;
      }

      .repo-link {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-badge {
        display: inline-block;
        max-width: 100%;
        margin-top: 3px;
        padding: 1px 5px;
        overflow: hidden;
        border: 1px solid #d7dae0;
        border-radius: 4px;
        background: #ffffff;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-badge.archived { color: #4b5563; }
      .status-badge.stopped { color: #8a4b00; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GitHub Momentum</h1>
      <p class="lead">star数の合計ではなく、いま1日あたり何star増えているかで並べます。</p>
      <p id="observation" class="observation" aria-live="polite">観測状況を読み込んでいます</p>
    </header>

    <div class="controls" aria-label="並べ替え">
      <button id="sort-velocity" type="button" disabled>勢い順</button>
      <button id="sort-stars" type="button" disabled>累計star順</button>
    </div>

    <p id="notice" class="notice" hidden>記録が1日分しかないため、勢いはまだ計算できません。明日から表示されます。</p>
    <p id="error" class="error" role="status" hidden>データを読み込めませんでした</p>

    <div id="table-wrap" class="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th class="rank numeric" scope="col">順位</th>
            <th class="repo" scope="col">リポジトリ</th>
            <th class="language" scope="col">言語</th>
            <th class="velocity numeric" scope="col">勢い</th>
            <th class="stars numeric" scope="col">累計star</th>
            <th class="status" scope="col">状態</th>
          </tr>
        </thead>
        <tbody id="repo-list"></tbody>
      </table>
    </div>
  </main>

  <script>
    const observation = document.querySelector("#observation");
    const notice = document.querySelector("#notice");
    const errorMessage = document.querySelector("#error");
    const tableWrap = document.querySelector("#table-wrap");
    const repoList = document.querySelector("#repo-list");
    const velocityButton = document.querySelector("#sort-velocity");
    const starsButton = document.querySelector("#sort-stars");

    let repositories = [];
    let referenceTime = Date.now();
    let sortMode = "stars";

    const numberFormat = new Intl.NumberFormat("en-US");

    // 観測日時を基準に、最終更新から180日以上経過したか判定する。
    function getStatus(repo) {
      if (repo.archived === true) {
        return { label: "保存済み", className: "archived" };
      }

      const pushedAt = Date.parse(repo.pushed_at);
      const daysSincePush = (referenceTime - pushedAt) / 86400000;
      if (Number.isFinite(daysSincePush) && daysSincePush >= 180) {
        return { label: "更新停止", className: "stopped" };
      }

      return { label: "", className: "" };
    }

    function makeCell(className = "") {
      const cell = document.createElement("td");
      cell.className = className;
      return cell;
    }

    function render() {
      const sorted = [...repositories].sort((a, b) => {
        if (sortMode === "stars") return b.stars - a.stars;

        // null は数値の大小にかかわらず必ず末尾へ送る。
        if (a.velocity === null && b.velocity === null) return b.stars - a.stars;
        if (a.velocity === null) return 1;
        if (b.velocity === null) return -1;
        return b.velocity - a.velocity || b.stars - a.stars;
      }).slice(0, 100);

      const fragment = document.createDocumentFragment();
      sorted.forEach((repo, index) => {
        const status = getStatus(repo);
        const row = document.createElement("tr");
        if (status.label) row.classList.add("has-status");

        const rankCell = makeCell("numeric");
        rankCell.textContent = String(index + 1);

        const repoCell = makeCell();
        const link = document.createElement("a");
        link.className = "repo-link";
        link.href = repo.html_url;
        link.textContent = repo.full_name;
        const repoTitle = document.createElement("div");
        repoTitle.className = "repo-title";
        repoTitle.append(link);
        if (status.label) {
          const statusBadge = document.createElement("span");
          statusBadge.className = `status-badge ${status.className}`;
          statusBadge.textContent = status.label;
          repoTitle.append(statusBadge);
        }
        repoCell.append(repoTitle);
        if (repo.description) {
          const description = document.createElement("span");
          description.className = "description";
          description.textContent = repo.description;
          description.title = repo.description;
          repoCell.append(description);
        }

        const languageCell = makeCell("language");
        languageCell.textContent = repo.language || "—";

        const velocityCell = makeCell("velocity numeric");
        if (typeof repo.velocity === "number") {
          velocityCell.classList.add("velocity-value");
          velocityCell.textContent = `+${repo.velocity.toFixed(1)} /日`;
        } else {
          velocityCell.classList.add("measuring");
          velocityCell.textContent = "計測中";
        }

        const starsCell = makeCell("stars numeric");
        starsCell.textContent = numberFormat.format(repo.stars);

        const statusCell = makeCell(`status ${status.className}`);
        statusCell.textContent = status.label;

        row.append(rankCell, repoCell, languageCell, velocityCell, starsCell, statusCell);
        fragment.append(row);
      });

      repoList.replaceChildren(fragment);
      velocityButton.setAttribute("aria-pressed", String(sortMode === "velocity"));
      starsButton.setAttribute("aria-pressed", String(sortMode === "stars"));
    }

    function setSortMode(mode) {
      sortMode = mode;
      render();
    }

    velocityButton.addEventListener("click", () => setSortMode("velocity"));
    starsButton.addEventListener("click", () => setSortMode("stars"));

    // ページが行う通信は、このJSON取得だけに限定する。
    fetch("data/latest.json")
      .then((response) => {
        if (!response.ok) throw new Error("Data request failed");
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data.repos)) throw new Error("Invalid data");

        repositories = data.repos;
        const generatedAt = Date.parse(data.generated_at);
        if (Number.isFinite(generatedAt)) referenceTime = generatedAt;

        observation.textContent = `観測開始 ${data.observed_since} ／ 記録 ${numberFormat.format(data.days_recorded)}日目 ／ 追跡 ${numberFormat.format(data.total_tracked)}件`;

        const velocityUnavailable = data.compared_with === null;
        velocityButton.disabled = velocityUnavailable;
        starsButton.disabled = false;
        notice.hidden = !velocityUnavailable;
        sortMode = velocityUnavailable ? "stars" : "velocity";

        render();
        tableWrap.hidden = false;
      })
      .catch(() => {
        observation.textContent = "観測状況を取得できませんでした";
        velocityButton.disabled = true;
        starsButton.disabled = true;
        errorMessage.hidden = false;
      });
  </script>
</body>
</html>
